server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # DNS Docker. Через переменную nginx резолвит api при запросах, а не один раз при старте:
    # иначе после пересоздания контейнера api (новый IP) сайт отдавал бы 502 до перезапуска web.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    # API — тот же origin, что и сайт, поэтому CORS не нужен.
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Файлы с хешем в имени можно кешировать навсегда.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: все остальные пути отдаёт React Router.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
